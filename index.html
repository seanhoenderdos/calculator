<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/display.css" />
    <link rel="stylesheet" href="./css/operators.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="calc-app">
      <div class="calc-screen">
        <div
          id="calculator-expression"
          class="calc-expression"
          role="status"
          aria-label="Expression"
        ></div>
        <output
          id="calculator-display"
          class="calc-display"
          aria-label="Current value"
          >0</output
        >
      </div>

      <div class="calc-keypad">
        <button type="button" class="btn-utility span-2" data-action="clear">
          AC
        </button>
        <button
          type="button"
          class="btn-operator"
          data-action="operator"
          data-value="/"
        >
          ÷
        </button>
        <button
          type="button"
          class="btn-operator"
          data-action="operator"
          data-value="*"
        >
          ×
        </button>

        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="7"
        >
          7
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="8"
        >
          8
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="9"
        >
          9
        </button>
        <button
          type="button"
          class="btn-operator"
          data-action="operator"
          data-value="-"
        >
          −
        </button>

        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="4"
        >
          4
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="5"
        >
          5
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="6"
        >
          6
        </button>
        <button
          type="button"
          class="btn-operator"
          data-action="operator"
          data-value="+"
        >
          +
        </button>

        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="1"
        >
          1
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="2"
        >
          2
        </button>
        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="3"
        >
          3
        </button>

        <button
          type="button"
          class="btn-equals span-vertical"
          data-action="equals"
        >
          =
        </button>

        <button
          type="button"
          class="btn-digit"
          data-action="digit"
          data-value="0"
        >
          0
        </button>
        <button type="button" class="btn-digit" data-action="decimal">.</button>
        <button type="button" class="btn-utility" data-action="backspace">
          ⌫
        </button>
      </div>
    </main>
  </body>
</html>
